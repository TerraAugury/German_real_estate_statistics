kpi.price-index.definition: "How commercial property prices in general compare with prices in a base year. The base year is set to 100."
kpi.rent-index.definition: "The rents agreed on new leases. They show current market rent, not rents in older contracts."
kpi.initial-yield.definition: "First-year rent as a share of the purchase price. It is the income return a buyer gets on day one."
kpi.office-vacancy.definition: "The share of office space that is empty. It is unused supply."
kpi.transaction-volume.definition: "The euro value of property sold, shown as an index. It shows how active the market is and how easy it is to buy and sell."
kpi.construction.definition: "Floor space approved for construction. It records building plans at the approval stage, ahead of completion."

# Link panel: the plain-language reading under the shift chart (owner's wording)
link.explain.heading: "How closely did these two series move together?"
link.explain.compared.A: "We compared how the two series changed from year to year between {from} and {to}. That gives {n} yearly comparisons."
link.explain.compared.Q: "We compared how the two series changed from the same quarter a year earlier, between {from} and {to}. That gives {n} quarterly comparisons. Neighbouring quarters overlap, because each change is measured against the same quarter a year earlier. So they count as only {eff} independent comparisons ({n} ÷ 4, rounded down)."
link.explain.result.lead: "Result: {rho}."
link.explain.result: "The scale runs from -1 to +1. A value of -1 means they always moved in opposite directions. A value of +1 means they always moved in the same direction. A value near 0 means there is no clear link. At {rho}, {reading}"
link.tier.none: "there is no clear tendency to move in either direction."
link.tier.reading: "there is a {tier} tendency to move in {dir}."
link.tier.very_weak: very weak
link.tier.weak: weak
link.tier.moderate: moderate
link.tier.strong: strong
link.dir.pos: the same direction
link.dir.neg: opposite directions
link.meaning.lead: "Is this result meaningful?"
link.meaning.inside: "Probably not. With only {n} comparisons, pure chance often produces values between -{band} and +{band} (the grey band on the chart). Our result sits {where} that band, so it could easily be luck."
link.meaning.outside: "Possibly. With {n} comparisons, pure chance only rarely produces values beyond -{band} and +{band} (the grey band on the chart). Our result sits outside that band, so it is unlikely to be luck alone. That is still not proof: see the warning below."
link.where.well_inside: well inside
link.where.inside: inside
link.best.lead: "A warning about the “best” result."
link.best: "We tested {n} different time shifts (for example, comparing one series with the other a year later). The chart marks the one with the strongest link. Because we picked it after seeing the data, it probably looks stronger than it really is."
link.not.lead: "What this does not tell you."
link.not: "Moving together does not mean one causes the other. This is not a forecast either."
