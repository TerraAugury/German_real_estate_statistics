links.intro: "Each row is a KPI (key figure) and each column an economic indicator (a figure from the wider economy). A box shows how closely their changes moved together. It also shows n, the number of periods compared. Where we cannot show a Link, the box says “Not shown”. Each KPI appears in its main view. Click a box to open the full Link on the KPI page."
