kpi.price-index.definition: "How commercial property prices in general compare with prices in a base year. The base year is set to 100."
kpi.rent-index.definition: "The rents agreed on new leases. They show current market rent, not rents in older contracts."
kpi.initial-yield.definition: "First-year rent as a share of the purchase price. It is the income return a buyer gets on day one."
kpi.office-vacancy.definition: "The share of office space that is empty. It is unused supply."
kpi.transaction-volume.definition: "The euro value of property sold, shown as an index. It shows how active the market is and how easy it is to buy and sell."
kpi.construction.definition: "Floor space approved for construction. It records building plans at the approval stage, ahead of completion."
