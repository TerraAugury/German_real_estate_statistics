insight.index.legend: "Blue line: the construction price index divided by the consumer price index. Both are set to {year} = 100 and compounded year by year (each year's change builds on the year before). The dashed line marks 100, the level in {year}."
insight.index.base_note: "We set the index to {year} = 100. The level depends on this choice."
insight.note.index_scope: "Construction prices are for office buildings. CPI (the consumer price index) is for a basket of goods that households buy."
