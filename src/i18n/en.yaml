insight.note.near_zero_rates: "Interest rates were near zero until 2022, so the average over this period may not reflect normal conditions."
insight.note.price_yield_coverage: "Prices and rents are vdp series for offices across Germany. The initial yields elsewhere on this site are bulwiengesa series for office and retail core properties in the 7 major cities. So they are not directly comparable."
insight.multiples.base_note: "We set both series to {year} = 100. The size of the gap depends on this choice."
insight.axis.growth: "change from the year before, %"
insight.multiples.label_growth: "{kpi} and {reference}, change from the year before"
insight.multiples.legend_growth: "Blue line: change of {kpi} from the year before. Ochre line: change of {reference} from the year before. The shading is blue where the blue line is above the ochre line and red where it is below. The gap between the lines in the latest year is the big number."
insight.multiples.legend_growth_real: "Blue line: change of {kpi} from the year before, adjusted for consumer prices. Ochre line: change of {reference} from the year before. The shading is blue where the blue line is above the ochre line and red where it is below. The gap between the lines in the latest year is the big number."
insight.multiples.legend_growth_rate: "Blue line: change of {kpi} from the year before. Ochre line: change of {reference} from the year before. The shading is blue where the blue line is above the ochre line and red where it is below."
insight.multiples.real_growth: "Real growth = (1 + rent growth) / (1 + inflation) − 1, so it differs slightly from the gap between the two lines."
insight.template.real-construction: "Real construction prices changed by {latest}% in {to}. This is {verdict} the {from}-{to} average of {mean}%."
insight.multiples.real_growth.real-construction: "Real growth = (1 + construction price growth) / (1 + inflation) − 1, so it differs slightly from the gap between the two lines."
