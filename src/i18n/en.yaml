insights.title: Insights
insights.intro: "Each Insight puts several series on one axis over a period we state. It comes with a fixed one-line reading. The reading describes what the lines show. It does not show a cause, and it is not a forecast. Gaps between two percentages are given in percentage points: from 4% to 5% is 1 percentage point."
insights.jump: Insights on this page
insights.tone.more: How better and worse are judged
insights.tone.legend: "A light green background means better and a light pink background means worse, for an investor in office property. A plain background means in line with the average, or neither side is better. Screen readers also read out the words “better” and “worse”."
insights.empty: "No Insights are published yet. We are still confirming the licences for their data."
