links.nominal.note: "* Nominale Euro sind nicht um die Inflation bereinigt. Mieten und Transaktionsvolumen sind in nominalen Euro. Ihre Verknüpfungen mit dem Verbraucherpreisindex und den Baupreisen spiegeln teilweise gemeinsame Inflation wider. Ihre Verknüpfung mit dem realen BIP stellt Nominal gegen real."
