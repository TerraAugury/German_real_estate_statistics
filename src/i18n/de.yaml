links.scale.neg: "-1: gegenläufig"
links.scale.zero: "0: kein Muster"
links.scale.pos: "+1: gleichläufig"
links.legend: "Farbe: ocker bedeutet, dass beide eher gemeinsam stiegen und fielen; blau bedeutet, dass die eine eher stieg, wenn die andere fiel. Je dunkler die Farbe, desto enger der Zusammenhang. Das zeigt, dass sie sich gemeinsam bewegen, nicht, dass eine die andere verursacht oder vorhersagt."
