nav.insights: Einblicke
insights.title: Einblicke
insights.intro: "Ein Einblick stellt mehrere Reihen über einen genannten Zeitraum auf einer Achse dar, mit einer festen Lesehilfe in einem Satz. Er beschreibt, was die Linien zeigen; er belegt keine Ursache und ist keine Prognose."
insights.jump: Einblicke auf dieser Seite
insights.tone.more: So werden besser und schlechter beurteilt
insights.tone.legend: "Hellgrün heißt: für Anleger in Büroimmobilien besser; hellrosa: schlechter. Eine ungefärbte Fläche liegt im Einklang mit dem Durchschnitt, oder keine Seite ist besser. Screenreader erhalten zusätzlich die Wörter „besser“ und „schlechter“."
insights.empty: "Noch sind keine Einblicke veröffentlicht; die Lizenzen für die zugrunde liegenden Daten werden geklärt."
