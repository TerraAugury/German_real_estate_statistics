nav.insights: Einblicke
insights.title: Einblicke
insights.intro: "Ein Einblick ist ein Diagramm, das mehrere Datenreihen auf einer Achse über einen genannten Zeitraum zeigt. Unter dem Diagramm erklärt eine kurze Lesehilfe in einem Satz, was die Linien zeigen. Sie beschreibt, was passiert ist. Sie erklärt nicht, warum es passiert ist, und sagt nicht voraus, was als Nächstes kommt. Wenn wir zwei Prozentwerte vergleichen, geben wir den Abstand in Prozentpunkten (PP) an."
insights.jump: Einblicke auf dieser Seite
insights.tone.more: So werden besser und schlechter beurteilt
insights.tone.legend: "Hellgrün heißt: besser für Anleger in Büroimmobilien. Hellrosa heißt: schlechter. Eine Fläche ohne Farbe heißt: im Einklang mit dem Durchschnitt, oder keine Seite ist besser. Screenreader lesen zusätzlich die Wörter „besser“ und „schlechter“ vor."
insights.empty: "Noch sind keine Einblicke veröffentlicht. Wir klären noch die Lizenzen für die zugrunde liegenden Daten."
