kpi.price-index.definition: "Wie sich die Preise von Gewerbeimmobilien im Allgemeinen zu den Preisen in einem Basisjahr verhalten. Das Basisjahr ist auf 100 gesetzt."
kpi.rent-index.definition: "Die Mieten, die in neuen Mietverträgen vereinbart werden. Sie zeigen die aktuelle Marktmiete, nicht die Mieten in älteren Verträgen."
kpi.initial-yield.definition: "Die Miete des ersten Jahres im Verhältnis zum Kaufpreis. Sie ist die laufende Rendite, die ein Käufer vom ersten Tag an erhält."
kpi.office-vacancy.definition: "Der Anteil der Büroflächen, die leer stehen. Das ist das ungenutzte Flächenangebot."
kpi.transaction-volume.definition: "Der Eurowert der verkauften Immobilien, dargestellt als Index. Er zeigt, wie aktiv der Markt ist und wie leicht sich Immobilien kaufen und verkaufen lassen."
kpi.construction.definition: "Die für den Bau genehmigte Fläche. Sie erfasst Bauvorhaben im Stadium der Genehmigung, vor der Fertigstellung."
links.lag.help_label: "Was bewirkt diese Auswahl?"
links.lag.help: "Eine Veränderung bei einem Wirtschaftsindikator zeigt sich bei Immobilien womöglich erst später. Hier wählen Sie, wie viele Jahre früher der Wirtschaftsindikator genommen wird: das gleiche Jahr, ein Jahr früher (N-1) oder zwei Jahre früher (N-2). „Vorab gewählt“ nimmt N-1 für die als vorab gewählt markierten Felder und für alle anderen das gleiche Jahr."

# Link panel: the plain-language reading under the shift chart (owner's wording)
link.explain.heading: "Wie stark haben sich diese beiden Reihen gemeinsam entwickelt?"
link.explain.compared.A: "Wir haben verglichen, wie sich die beiden Reihen zwischen {from} und {to} von Jahr zu Jahr verändert haben. Das ergibt {n} jährliche Vergleiche."
link.explain.compared.Q: "Wir haben verglichen, wie sich die beiden Reihen zwischen {from} und {to} gegenüber demselben Quartal des Vorjahres verändert haben. Das ergibt {n} vierteljährliche Vergleiche. Benachbarte Quartale überlappen sich, weil jede Veränderung mit demselben Quartal des Vorjahres verglichen wird. Sie zählen daher nur wie {eff} unabhängige Vergleiche ({n} ÷ 4, abgerundet)."
link.explain.result.lead: "Ergebnis: {rho}."
link.explain.result: "Die Skala reicht von -1 bis +1. Der Wert -1 bedeutet, dass sich beide immer gegenläufig bewegt haben. Der Wert +1 bedeutet, dass sie sich immer gleichläufig bewegt haben. Ein Wert nahe 0 bedeutet, dass kein klarer Zusammenhang erkennbar ist. Bei {rho} {reading}"
link.tier.none: "gibt es keine klare Tendenz, sich in die eine oder andere Richtung zu bewegen."
link.tier.reading: "gibt es eine {tier} Tendenz, sich {dir} zu bewegen."
link.tier.very_weak: sehr schwache
link.tier.weak: schwache
link.tier.moderate: mäßige
link.tier.strong: starke
link.dir.pos: gleichläufig
link.dir.neg: gegenläufig
link.meaning.lead: "Ist dieses Ergebnis aussagekräftig?"
link.meaning.inside: "Wahrscheinlich nicht. Bei nur {n} Vergleichen erzeugt der reine Zufall oft Werte zwischen -{band} und +{band} (das graue Band in der Grafik). Unser Ergebnis liegt {where} dieses Bandes, es kann also leicht Zufall sein."
link.meaning.outside: "Möglicherweise. Bei {n} Vergleichen erzeugt der reine Zufall nur selten Werte jenseits von -{band} und +{band} (das graue Band in der Grafik). Unser Ergebnis liegt außerhalb dieses Bandes, ist also wohl nicht allein Zufall. Ein Beweis ist das trotzdem nicht: siehe die Warnung unten."
link.where.well_inside: weit innerhalb
link.where.inside: innerhalb
link.best.lead: "Achtung beim „besten“ Ergebnis."
link.best: "Wir haben {n} verschiedene Zeitverschiebungen getestet (zum Beispiel: eine Reihe mit der anderen ein Jahr später vergleichen). Die Grafik markiert die Verschiebung mit dem stärksten Zusammenhang. Weil wir sie erst nach einem Blick auf die Daten ausgewählt haben, sieht sie wahrscheinlich stärker aus, als sie ist."
link.not.lead: "Was das nicht aussagt."
link.not: "Gemeinsame Bewegung heißt nicht, dass das eine das andere verursacht. Es ist auch keine Prognose."
