links.preset.note: "Renditen und Preise, die auf Bewertungen beruhen, reagieren mit Verzögerung auf Zinsen. Für diese Felder legen wir ein Jahr früher (N-1) im Voraus aus ökonomischen Gründen fest. Wir haben es nicht anhand der Ergebnisse gewählt."
link.band.legend: "Graues Band: der Bereich der Rangkorrelation, den allein der Zufall bei Verschiebung 0 und n = {n} häufig erzeugt (±{band}; jeder Balken verwendet sein eigenes n). Es ist eine grobe Orientierung, kein Signifikanztest."
link.band.adjusted: "Quartalsveränderungen werden jeweils mit dem Vorjahr verglichen, benachbarte Quartale überlappen also. Das Band verwendet ein angepasstes n = {eff} (n ÷ 4, abgerundet)."
