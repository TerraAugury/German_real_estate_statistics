insight.multiples.legend: "Blaue Linie: {kpi}. Ockerfarbene Linie: {reference}. Die Schattierung ist blau, wo die blaue Linie über der ockerfarbenen liegt, und rot, wo sie darunter liegt."
insight.multiples.legend_dual: "Blaue Linie, linke Achse: {kpi}. Ockerfarbene Linie, rechte Achse: {reference}. Die Achsen haben unterschiedliche Einheiten, daher werden die Linien nicht nach ihrer Höhe verglichen."
insight.note.near_zero_rates: "Der Zeitraum ist von Nullzinsen geprägt (bis 2022); sein Durchschnitt spiegelt womöglich nicht die normalen Verhältnisse wider."
insight.note.price_yield_coverage: "Preise und Mieten sind vdp-Reihen für Büros in ganz Deutschland. Die Anfangsrenditen an anderer Stelle dieser Seite sind bulwiengesa-Reihen für Core-Immobilien (Büro und Einzelhandel zusammen) in den 7 Großstädten und daher nicht direkt vergleichbar."
insight.multiples.base_note: "Beide Reihen auf {year} = 100 gesetzt; die Größe des Abstands hängt von dieser Wahl ab."
insight.axis.growth: "Veränderung gegenüber dem Vorjahr, %"
insight.multiples.label_growth: "{kpi} und {reference}, Veränderung gegenüber dem Vorjahr"
insight.multiples.legend_growth: "Blaue Linie: Veränderung von {kpi} gegenüber dem Vorjahr. Ockerfarbene Linie: Veränderung von {reference} gegenüber dem Vorjahr. Die Schattierung ist blau, wo die blaue Linie über der ockerfarbenen liegt, und rot, wo sie darunter liegt; der Abstand der Linien im letzten Jahr ist die große Zahl."
insight.multiples.legend_growth_real: "Blaue Linie: preisbereinigte Veränderung von {kpi} gegenüber dem Vorjahr. Ockerfarbene Linie: Veränderung von {reference} gegenüber dem Vorjahr. Die Schattierung ist blau, wo die blaue Linie über der ockerfarbenen liegt, und rot, wo sie darunter liegt; der Abstand der Linien im letzten Jahr ist die große Zahl."
insight.multiples.real_growth: "Reales Wachstum = (1 + Mietwachstum) / (1 + Inflation) − 1, daher weicht es leicht vom Abstand der beiden Linien ab."
insight.template.completions-permits: "Die Fertigstellungen entsprachen dem {latest}-Fachen der zwei Jahre zuvor erteilten Baugenehmigungen, {verdict} {from}-{to}-Durchschnitt von {mean}."
