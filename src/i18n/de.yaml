links.legend: "Farbe: olivgrün bedeutet, dass beide eher gemeinsam stiegen und fielen. Bei violett stieg die eine eher, wenn die andere fiel. Je dunkler die Farbe, desto enger der Zusammenhang. Das zeigt, dass sie sich gemeinsam bewegen. Es zeigt nicht, dass eine die andere verursacht oder vorhersagt."
