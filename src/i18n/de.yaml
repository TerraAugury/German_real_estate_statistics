links.title: Verknüpfungen
links.intro: "Jede Zeile ist eine Kennzahl, jede Spalte ein Wirtschaftsindikator (eine Größe aus der Gesamtwirtschaft). Ein Feld zeigt, wie eng sich ihre Veränderungen gemeinsam bewegt haben. Dazu steht n, die Zahl der verglichenen Zeiträume. Wo wir die Verknüpfung nicht anzeigen können, steht im Feld „Nicht angezeigt“. Jede Kennzahl erscheint in ihrer Hauptansicht. Ein Klick auf ein Feld öffnet die vollständige Verknüpfung auf der Kennzahlseite."
