insight.index.legend: "Blaue Linie: der Baupreisindex geteilt durch den Verbraucherpreisindex. Beide sind auf {year} = 100 gesetzt und Jahr für Jahr aufgezinst (die Veränderung jedes Jahres baut auf dem Vorjahr auf). Die gestrichelte Linie markiert 100, den Stand von {year}."
insight.index.base_note: "Wir setzen den Index auf {year} = 100. Das Niveau hängt von dieser Wahl ab."
insight.note.index_scope: "Die Baupreise gelten für Bürogebäude. Der Verbraucherpreisindex gilt für einen Warenkorb privater Haushalte."
