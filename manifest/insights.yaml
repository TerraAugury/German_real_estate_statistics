# Insights (insights spec section 7): one entry per curated chart, in page order. An Insight's Provisional status is
# never declared here: it follows from its series (an Insight with any Provisional series is hidden in production).
# `headline` names how the two series are compared; `growth: true` compares their year-on-year percent changes; a growth Insight (this or
# a `growth` headline) draws those year-on-year changes as its lines; any other `base` rebases the lines behind the headline to that year = 100,
# except series in % (never rebased); `indexed` takes a ratio of two indices after rebasing;
# `deflate` (flow or stock) deflates a `growth` headline by the reference price level, or a `growth` spread by its `deflator` series; `shift` pairs the reference of year t - shift.
# `better` is the direction that is better for an office investor (higher, lower, or none where it depends on whose side you take);
# the verdict tag is coloured by it, never by the sign of the number. `notes` lists interface string keys shown as Notes under the chart.
# The first `kpi` series against the first `reference` series is the headline.

- key: a
  title: { en: "Initial yield spread over the 10-year Bund, by City class", de: "Renditeabstand der Anfangsrendite zur 10-jährigen Bundesanleihe, nach Städtegruppe" }
  measure: { en: "spread of the 7-city initial yield over the 10-year Bund yield", de: "Abstand der Anfangsrendite in den 7 Großstädten zur Rendite zehnjähriger Bundesanleihen" }
  definition: { en: "The extra return investors require for holding property income, which is risky and hard to sell, instead of a safe government bond. It is the risk premium on property.", de: "Der zusätzliche Ertrag, den Anleger für Immobilieneinnahmen verlangen, die riskant und schwer verkäuflich sind, statt einer sicheren Staatsanleihe. Er ist die Risikoprämie von Immobilien." }
  headline: spread
  better: higher
  template: spread
  series:
    - { key: initial-yield-combined-7, role: kpi }
    - { key: initial-yield-combined-127, role: kpi }
    - { key: bund-yield-10y, role: reference }

- key: f
  title: { en: "Initial yield spread over the corporate loan rate", de: "Renditeabstand der Anfangsrendite zum Unternehmenskreditzins" }
  measure: { en: "spread of the 7-city initial yield over the corporate loan rate", de: "Abstand der Anfangsrendite in den 7 Großstädten zum Unternehmenskreditzins" }
  definition: { en: "The margin between what a property earns and what it costs to borrow. It shows whether borrowing to buy adds to the return or reduces it.", de: "Die Spanne zwischen dem, was eine Immobilie einbringt, und dem, was die Kreditaufnahme kostet. Sie zeigt, ob ein Kauf auf Kredit die Rendite erhöht oder verringert." }
  headline: spread
  better: higher
  notes: [insight.note.near_zero_rates]
  template: spread
  series:
    - { key: initial-yield-combined-7, role: kpi }
    - { key: loan-rate-nfc, role: reference }

- key: g
  title: { en: "Office prices vs rents", de: "Büropreise und Büromieten" }
  measure: { en: "ratio of the office price index to the rent index", de: "Verhältnis des Büropreisindex zum Mietindex" }
  definition: { en: "How much investors pay for each unit of rent. It is a price-to-rent valuation measure and shows how prices compare with the income they buy.", de: "Wie viel Anleger für jede Einheit Miete zahlen. Das Verhältnis von Preis zu Miete ist ein Bewertungsmaß und zeigt, wie sich die Preise zu den Einnahmen verhalten, die man damit erwirbt." }
  headline: ratio
  better: none
  indexed: true
  base: 2015
  notes: [insight.note.near_zero_rates, insight.note.price_yield_coverage]
  template: price-rent
  series:
    - { key: price-index-de-office-a, role: kpi }
    - { key: rent-index-de-office-a, role: reference }

- key: b
  title: { en: "Real office rents", de: "Reale Büromieten" }
  measure: { en: "real growth of office rents", de: "reales Wachstum der Büromieten" }
  definition: { en: "The change in office rent after removing general inflation. It shows whether a landlord's income keeps its buying power.", de: "Die Veränderung der Büromiete nach Abzug der allgemeinen Inflation. Sie zeigt, ob das Einkommen eines Vermieters seine Kaufkraft behält." }
  headline: growth
  better: higher
  deflate: flow
  template: real-rents
  series:
    - { key: rent-index-de-office-a, role: kpi }
    - { key: cpi, role: reference }

- key: d
  title: { en: "Office rents vs construction costs", de: "Büromieten und Baupreise" }
  measure: { en: "spread of office rent growth over construction price growth", de: "Abstand des Mietwachstums bei Büros zum Baupreisanstieg" }
  definition: { en: "How office rents keep pace with the cost of building. It shows how attractive it is to build new offices.", de: "Wie die Büromieten mit den Baukosten Schritt halten. Das zeigt, wie attraktiv der Neubau von Büros ist." }
  headline: spread
  better: higher
  growth: true
  template: spread
  series:
    - { key: rent-index-de-office-a, role: kpi }
    - { key: construction-price-office, role: reference }

- key: i
  title: { en: "Real office rents vs real GDP", de: "Reale Büromieten und reale Wirtschaftsleistung" }
  measure: { en: "spread of real office rent growth over real GDP growth", de: "Abstand des realen Mietwachstums bei Büros zum Wachstum des realen BIP" }
  definition: { en: "Whether office rents, after removing inflation, move with the whole economy or drift away from it. It links property income to economic output.", de: "Ob sich die Büromieten nach Abzug der Inflation mit der gesamten Wirtschaft bewegen oder sich davon lösen. Das verbindet Mieteinnahmen mit der Wirtschaftsleistung." }
  headline: spread
  better: higher
  growth: true
  deflate: flow
  template: spread
  series:
    - { key: rent-index-de-office-a, role: kpi }
    - { key: gdp-real, role: reference }
    - { key: cpi, role: deflator }

- key: c
  title: { en: "Office completions vs permits two years earlier", de: "Büro-Fertigstellungen und Baugenehmigungen zwei Jahre zuvor" }
  measure: { en: "ratio of completions to permits two years earlier", de: "Anteil der Fertigstellungen an den Baugenehmigungen zwei Jahre zuvor" }
  definition: { en: "The share of approved office projects that actually get built. It shows how much planned supply reaches the market.", de: "Der Anteil der genehmigten Büroprojekte, die tatsächlich gebaut werden. Er zeigt, wie viel des geplanten Angebots den Markt erreicht." }
  headline: ratio
  better: none
  base: 2015
  shift: 2
  template: completions-permits
  series:
    - { key: construction-completions-office, role: kpi }
    - { key: construction-permits-office, role: reference }

- key: j
  title: { en: "Construction costs vs inflation", de: "Baupreise und Inflation" }
  measure: { en: "spread of construction price growth over CPI inflation", de: "Abstand des Baupreisanstiegs zur Inflationsrate" }
  definition: { en: "Building costs measured against general consumer prices, so that the building-specific part stands out. It points to the cost of replacing a building.", de: "Die Baukosten im Vergleich zu den allgemeinen Verbraucherpreisen, sodass der baubezogene Anteil sichtbar wird. Das verweist auf die Kosten für den Ersatz eines Gebäudes." }
  headline: spread
  better: lower
  growth: true
  template: spread
  series:
    - { key: construction-price-office, role: kpi }
    - { key: cpi, role: reference }

- key: e
  title: { en: "Office vacancy: 7 major cities vs 127 towns", de: "Büroleerstand: A-Städte und 127 Städte" }
  measure: { en: "spread of office vacancy in the 7 major cities over the 127 towns", de: "Abstand der Büroleerstandsquote in den 7 Großstädten zu den 127 Städten" }
  definition: { en: "How the balance of supply and demand for office space in the big cities compares with that in a wider group of towns. It shows where space is harder to let.", de: "Wie sich das Verhältnis von Angebot und Nachfrage bei Büroflächen in den großen Städten zu dem in einer größeren Gruppe von Städten verhält. Es zeigt, wo sich Flächen schwerer vermieten lassen." }
  headline: spread
  better: lower
  template: spread
  series:
    - { key: office-vacancy-7, role: kpi }
    - { key: office-vacancy-127, role: reference }

- key: m
  title: { en: "Office vacancy and office employment", de: "Büroleerstand und Bürobeschäftigung" }
  measure: { en: "change in office vacancy in the 127 towns", de: "Veränderung des Büroleerstands in den 127 Städten" }
  definition: { en: "Whether empty office space moves together with the number of office workers. It links unused space to office jobs.", de: "Ob sich leer stehende Büroflächen gemeinsam mit der Zahl der Bürobeschäftigten bewegen. Das verbindet ungenutzte Fläche mit Bürobeschäftigung." }
  headline: change
  better: lower
  base: 2015
  template: office-employment
  series:
    - { key: office-vacancy-127, role: kpi }
    - { key: office-employment, role: reference }

- key: n
  title: { en: "Office vacancy and new office completions", de: "Büroleerstand und neue Büro-Fertigstellungen" }
  measure: { en: "change in office vacancy in the 127 towns", de: "Veränderung des Büroleerstands in den 127 Städten" }
  headline: deviation
  better: lower
  base: 2015
  notes: [insight.note.completions_scope, insight.note.completions_coverage]
  template: vacancy-completions
  series:
    - { key: office-vacancy-127, role: kpi }
    - { key: construction-completions-office, role: reference }

- key: o
  title: { en: "Office vacancy and office rent growth", de: "Büroleerstand und Büromietwachstum" }
  measure: { en: "gap between office vacancy in the 127 towns and its average", de: "Abstand des Büroleerstands in den 127 Städten zu seinem Durchschnitt" }
  headline: gap
  better: lower
  small: vacancy-rents
  notes: [insight.note.rents_scope, insight.note.asking_rents]
  template: vacancy-rents
  series:
    - { key: office-vacancy-127, role: kpi }
    - { key: rent-index-de-office-a, role: reference }
    - { key: cpi, role: deflator }
